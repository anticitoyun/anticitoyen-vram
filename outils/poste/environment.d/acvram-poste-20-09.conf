# Lot poste du 20/09/2026 (revue/sage-poste-lot-20-09) — a installer dans ~/.config/environment.d/
# (systemd --user : lu au demarrage de la session ; il n'existe AUCUNE unite acvram.service,
# le serveur est lance par la GUI ou par outils/carte.sh, donc l'environnement de session
# est le seul point commun a tous les lancements).
# Modeles mesures : copie des alias de outils/poste/alias-servis-20-09.txt sur nvme3.
ACVRAM_MODELES=/mnt/AI_GENERATOR/models_acvram
ACVRAM_MODELS_DIR=/mnt/AI_GENERATOR/models_acvram
# THP hote pour les tenseurs PyTorch (madvise >= 1 Mo) ; /sys/kernel/mm/transparent_hugepage/enabled reste madvise.
THP_MEM_ALLOC_ENABLE=1
# Fils CPU bornes : 8 fils OpenMP/torch ; affinite P-cores appliquee par outils/carte.sh (taskset) quand ACVRAM_CPUS est pose.
OMP_NUM_THREADS=8
ACVRAM_CPUS=0-15
