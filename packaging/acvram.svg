<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Trois barres de largeurs decroissantes : 16 bits, 8 bits, 4 bits.
       C'est ce que fait acvram — donner a chaque etage le format que son
       silicium sait lire — et cela se lit sans legende a 24 pixels. -->
  <rect width="64" height="64" rx="13" fill="#0f1115"/>
  <rect x="12" y="15" width="40" height="7" rx="3.5" fill="#5eead4"/>
  <rect x="12" y="28.5" width="27" height="7" rx="3.5" fill="#38bdf8"/>
  <rect x="12" y="42" width="14" height="7" rx="3.5" fill="#818cf8"/>
</svg>
