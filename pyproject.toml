[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acvram"
version = "0.4.18"
description = "anticitoyen VRAM/RAM — passerelle d'inference compatible OpenAI, quantification par GPU et etagement VRAM->VRAM->RAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "anticitoyen" }]
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "safetensors>=0.4.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "rich>=13"]
nvml = ["nvidia-ml-py>=12.560"]

[project.scripts]
acvram = "acvram.cli:main"

[tool.setuptools.packages.find]
include = ["acvram*"]

[tool.setuptools.package-data]
acvram = ["kernels/*.cu", "kernels/*.cuh", "kernels/*.cpp", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
